<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>{{ TITLE }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:32px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.06);">
    <div style="padding:24px 28px;background:linear-gradient(135deg,#1677ff,#69b1ff);color:#fff;">
      <h2 style="margin:0;font-size:20px;">{{ PROJECTNAME }}</h2>
      <p style="margin:8px 0 0;opacity:.9;">{{ TITLE }}</p>
    </div>
    <div style="padding:28px;">
      <p style="margin:0 0 16px;color:#333;font-size:15px;">您的验证码为：</p>
      <div style="margin:8px 0 20px;">{{ CODE|safe }}</div>
      <p style="margin:0;color:#888;font-size:13px;line-height:1.7;">
        验证码短期内有效，请勿泄露给他人。如非本人操作，请忽略本邮件。
      </p>
    </div>
  </div>
</body>
</html>
